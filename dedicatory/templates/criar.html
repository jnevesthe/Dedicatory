{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Dedication — Love Dedicatory</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff477e;
      --primary-dark: #d62f63;
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #fff8fb 100%);
      --text-main: #2d2d2d;
      --text-muted: #666;
      --white: #ffffff;
      --shadow: 0 10px 30px -10px rgba(255, 71, 126, 0.3);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Outfit", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Glassmorphism */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 71, 126, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      color: var(--primary);
      font-style: italic;
    }

    nav a {
      color: var(--text-muted);
      margin-left: 15px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
    }

    /* Layout do Formulário */
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
    }

    .form-card {
      background: var(--white);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .form-card h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 10px;
    }

    .form-card p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    /* Estilização do Form Django (as_p) */
    form p {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    form label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    form input, form select, form textarea {
      padding: 14px 18px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #fafafa;
    }

    form input:focus, form select:focus, form textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 71, 126, 0.05);
    }

    .helptext {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 5px;
      font-style: italic;
    }

    /* Botão Principal */
    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 71, 126, 0.4);
    }

    .banner-wrapper {
      margin: 20px 0;
      display: flex;
      justify-content: center;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }

    /* Responsivo */
    @media (max-width: 600px) {
      .form-card { padding: 25px 20px; }
      header { flex-direction: column; gap: 10px; }
      nav { margin-bottom: 5px; }
      .form-card h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Love Dedicatory 💌</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'contact' %}">Contact</a>
      <a href="{% url 'privacy' %}">Privacy</a>
    </nav>
  </header>

  <div class="container">
    
    

    <main class="form-card">
      <h1>Create Dedication</h1>
      <p class="subtitle">Turn your feelings into a lasting memory.</p>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" class="btn-submit">Generate Magic Link ✨</button>
      </form>
    </main>

    <div class="banner-wrapper">
       {% include 'includes/banner320x50_1.html' %}
    </div> 

  </div>

  <footer>
    © 2025 Love Dedicatory. Made with ❤️ by Josemar Neves.
  </footer>

</body>
  </html>
