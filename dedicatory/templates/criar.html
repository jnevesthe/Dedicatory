{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ===================== SEO ===================== -->

  <meta name="description" content="Create a free, heartfelt dedication for your partner, dad, brother, or best friend. Add photos and a personal message, then share it with a unique link.">
  <meta name="keywords" content="create dedication, love message generator, online love letter, dedication maker, message for boyfriend, message for girlfriend">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://love-dedicatory.xyz/create/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Create Dedication — Love Dedicatory">
  <meta property="og:description" content="Turn your feelings into a lasting memory. Create a free love dedication and share it with a unique link.">
  <meta property="og:url" content="https://love-dedicatory.xyz/create/">
  <meta property="og:image" content="{% static 'img/love1.png' %}">
  <meta property="og:locale" content="en_US">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Create Dedication — Love Dedicatory">
  <meta name="twitter:description" content="Turn your feelings into a lasting memory with a free love dedication.">
  <meta name="twitter:image" content="{% static 'img/love1.png' %}">

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "Create Dedication — Love Dedicatory",
    "url": "https://love-dedicatory.xyz/create/",
    "description": "Create a free, heartfelt love dedication with photos and a personal message, then share it with a unique link.",
    "isPartOf": {
      "@type": "WebSite",
      "name": "Love Dedicatory",
      "url": "https://love-dedicatory.xyz/"
    }
  }
  </script>

  {% include 'adsense.html' %}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ff477e;
      --primary-dark: #d62f63;
      --bg-gradient: linear-gradient(135deg, #fff0f5 0%, #fff8fb 100%);
      --text-main: #2d2d2d;
      --text-muted: #666;
      --white: #ffffff;
      --shadow: 0 10px 30px -10px rgba(255, 71, 126, 0.3);
      --radius: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Outfit", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Glassmorphism */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 71, 126, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: 1.4rem;
      color: var(--primary);
      font-style: italic;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 15px;
      justify-content: center;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    nav a:hover, nav a:focus-visible {
      color: var(--primary);
    }

    nav a:focus-visible, .btn-submit:focus-visible {
      outline: 2px solid var(--primary-dark);
      outline-offset: 3px;
    }

    /* Layout do Formulário */
    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      flex: 1;
    }

    .form-card {
      background: var(--white);
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .form-card h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      color: var(--text-main);
      text-align: center;
      margin-bottom: 10px;
    }

    .form-card p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 30px;
    }

    /* Estilização do Form Django (as_p) */
    form p {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
    }

    form label {
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    form input, form select, form textarea {
      padding: 14px 18px;
      border: 2px solid #f0f0f0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #fafafa;
      width: 100%;
    }

    form textarea {
      min-height: 120px;
      resize: vertical;
    }

    form input:focus, form select:focus, form textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(255, 71, 126, 0.08);
    }

    /* Inputs de arquivo (fotos) com aparência mais amigável no celular */
    form input[type="file"] {
      padding: 12px;
      background: #fff5f8;
      border-style: dashed;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .helptext {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 5px;
      font-style: italic;
    }

    /* Erros de validação do Django */
    form ul.errorlist {
      list-style: none;
      color: var(--primary-dark);
      font-size: 0.85rem;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Botão Principal */
    .btn-submit {
      background: var(--primary);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(255, 71, 126, 0.3);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 71, 126, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: auto;
    }

    /* ===================== RESPONSIVO / MOBILE-FIRST ===================== */
    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 0 14px;
      }

      .form-card {
        padding: 26px 18px;
        border-radius: 16px;
      }

      header {
        flex-direction: column;
        gap: 8px;
        padding: 12px 16px;
      }

      nav {
        gap: 4px 12px;
      }

      nav a {
        font-size: 0.85rem;
      }

      .form-card h1 {
        font-size: 1.7rem;
      }

      .form-card p.subtitle {
        font-size: 0.9rem;
        margin-bottom: 22px;
      }

      form input, form select, form textarea {
        padding: 13px 14px;
        font-size: 1rem; /* mantém 16px+ efetivos para evitar zoom automático no iOS */
      }

      .btn-submit {
        font-size: 1rem;
        padding: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Love Dedicatory 💌</h1>
    <nav>
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'about' %}">About</a>
      <a href="{% url 'contact' %}">Contact</a>
      <a href="{% url 'privacy' %}">Privacy</a>
    </nav>
  </header>

  <div class="container">

    <main class="form-card">
      <h1>Create Dedication</h1>
      <p class="subtitle">Turn your feelings into a lasting memory.</p>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-submit">Generate Magic Link ✨</button>
      </form>
    </main>

  </div>

  <footer>
    © <span id="ano-atual">2025</span> Love Dedicatory. Made with ❤️ by Josemar Neves.
  </footer>

  <script>
    document.getElementById('ano-atual').textContent = new Date().getFullYear();
  </script>

</body>
  </html>
