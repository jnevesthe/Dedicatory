<!-- ===================== COOKIE CONSENT ===================== -->
<div id="cookie-banner" style="display:none;">
  <div id="cookie-inner">
    <div id="cookie-icon">🍪</div>
    <div id="cookie-text">
      <strong>We use cookies</strong>
      <p>This site uses cookies to improve your experience and show personalized ads (Google AdSense). By continuing to browse, you agree to our use of cookies. <a href="https://love-dedicatory.xyz/privacy/" target="_blank" rel="noopener" style="color:#ff477e;font-weight:600;text-decoration:underline;">Privacy Policy</a></p>
    </div>
    <div id="cookie-buttons">
      <button id="cookie-accept">Accept</button>
      <button id="cookie-decline">Decline</button>
    </div>
  </div>
</div>

<style>
  #cookie-banner {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    width: calc(100% - 40px);
    max-width: 640px;
    animation: slideUp 0.4s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateX(-50%) translateY(30px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  #cookie-inner {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.15);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    border-top: 4px solid #ff477e;
  }

  #cookie-icon {
    font-size: 2rem;
    flex-shrink: 0;
  }

  #cookie-text {
    flex: 1;
    min-width: 200px;
  }

  #cookie-text strong {
    font-family: "Playfair Display", serif;
    font-size: 1rem;
    color: #2d2d2d;
    display: block;
    margin-bottom: 4px;
  }

  #cookie-text p {
    font-size: 0.8rem;
    color: #666;
    line-height: 1.5;
    margin: 0;
  }

  #cookie-buttons {
    display: flex;
    gap: 10px;
    flex-shrink: 0;
  }

  #cookie-accept {
    background: #ff477e;
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 10px 22px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
    font-family: "Outfit", sans-serif;
  }

  #cookie-accept:hover { background: #e0325f; }

  #cookie-decline {
    background: transparent;
    color: #999;
    border: 2px solid #eee;
    border-radius: 50px;
    padding: 10px 18px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: "Outfit", sans-serif;
  }

  #cookie-decline:hover { border-color: #ccc; color: #666; }

  @media (max-width: 480px) {
    #cookie-inner { flex-direction: column; text-align: center; }
    #cookie-buttons { width: 100%; justify-content: center; }
  }
</style>

<script>
  (function () {
    var consent = localStorage.getItem('cookie_consent');

    // Já decidiu antes — não mostra nada
    if (consent === 'accepted' || consent === 'declined') return;

    // Primeira visita — mostra o banner
    var banner = document.getElementById('cookie-banner');
    banner.style.display = 'block';

    document.getElementById('cookie-accept').addEventListener('click', function () {
      localStorage.setItem('cookie_consent', 'accepted');
      banner.style.display = 'none';
    });

    document.getElementById('cookie-decline').addEventListener('click', function () {
      localStorage.setItem('cookie_consent', 'declined');
      banner.style.display = 'none';
    });
  })();
</script>
<!-- ========================================================= -->
