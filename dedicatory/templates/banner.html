<div class="lb-banner-wrap" id="lbBannerWrap">
  <button type="button" class="lb-banner-close" id="lbBannerClose" aria-label="Fechar anúncio">&times;</button>
  <div data-mndbanid="911c0d72-ecc5-4f1f-9d06-2a4b8754aa60"></div>
</div>

<style>
  .lb-banner-wrap {
    position: relative;
    display: inline-block;
    vertical-align: middle;
  }

  .lb-banner-close {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 20px;
    height: 20px;
    line-height: 18px;
    padding: 0;
    border: 2px solid #fff;
    border-radius: 50%;
    background: #e63946;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    z-index: 10;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .lb-banner-close:hover {
    background: #c1121f;
  }
</style>

<script>
  (function () {
    var wrap = document.getElementById('lbBannerWrap');
    var closeBtn = document.getElementById('lbBannerClose');
    if (!wrap || !closeBtn) return;

    closeBtn.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      wrap.remove();
    });
  })();
</script>
